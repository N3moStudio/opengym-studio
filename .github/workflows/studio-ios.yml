name: Gymaura iOS build

on:
  workflow_dispatch:
  push:
    branches: [gymaura-redesign]

permissions:
  contents: read

concurrency:
  group: gymaura-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    # Standard hosted runners are free for public repositories. Do not run this
    # workflow against a private repository's metered allowance.
    if: github.event.repository.private == false
    runs-on: macos-26
    timeout-minutes: 60
    env:
      APP_BUILD: gymaura.${{ github.run_number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Check navigation and Home customization
        working-directory: frontend
        run: >-
          npm test --
          src/components/StudioAppearance.test.jsx
          src/components/TabBar.navigation.test.jsx
          src/components/TabBar.retap.test.jsx
          src/views/Home.startdoor.test.jsx
          src/views/Stats.redesign.test.jsx
          src/lib/widget-links.test.js
          src/views/Home.modules.test.jsx
          src/views/Home.weight-card.test.jsx
          src/views/Home.weight-chart.test.jsx
          src/components/CustomizeHome.test.jsx
          src/lib/page-motion.test.js
          src/lib/edge-swipe-back.test.js
          src/lib/edge-swipe-back.coexist.test.jsx
          src/lib/edge-swipe-back.interruption.test.js
      - name: Build app and bundle exercise illustrations
        working-directory: frontend
        run: npm run build:mobile
      - name: Save interface preview
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: Gymaura-interface-preview
          path: |
            frontend/dist
            !frontend/dist/exercise-media/**
          retention-days: 7
      - name: Add native extensions and Watch app
        working-directory: frontend
        run: |
          ruby ios/ci/add-asset-downloader.rb
          ruby ios/ci/add-watch-app.rb
          ruby ios/ci/add-widgets.rb
      - name: Archive and package unsigned IPA
        run: bash scripts/ios/build-gymaura-unsigned.sh
      - name: Save IPA
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: Gymaura-unsigned
          path: |
            frontend/ios/App/build/Gymaura-unsigned.ipa
            frontend/ios/App/build/Gymaura-unsigned.ipa.sha256
            frontend/ios/App/build/ci-commit.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Save build log
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: gymaura-ios-build-log
          path: frontend/ios/App/build/archive.log
          if-no-files-found: ignore
          retention-days: 7
